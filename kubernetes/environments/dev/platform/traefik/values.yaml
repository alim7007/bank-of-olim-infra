deployment:
  kind: DaemonSet

ingressClass:
  enabled: true
  isDefaultClass: true

providers:
  kubernetesCRD:
    enabled: true

  kubernetesIngress:
    enabled: true

    publishedService:
      enabled: false

gateway:
  enabled: false

service:
  enabled: false

ports:
  web:
    port: 8000
    hostPort: 80
    expose:
      default: true
    exposedPort: 80

  websecure:
    port: 8443
    hostPort: 443
    expose:
      default: true
    exposedPort: 443

log:
  level: INFO

accessLog:
  enabled: true

metrics:
  prometheus:
    enabled: true