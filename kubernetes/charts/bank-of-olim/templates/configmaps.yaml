apiVersion: v1
kind: ConfigMap

metadata:
  name: environment-config

data:
  LOCAL_ROUTING_NUM: {{ .Values.config.localRoutingNum | quote }}
  PUB_KEY_PATH: "/tmp/.ssh/publickey"

---
apiVersion: v1
kind: ConfigMap

metadata:
  name: service-api-config

data:
  TRANSACTIONS_API_ADDR: "ledgerwriter:8080"
  BALANCES_API_ADDR: "balancereader:8080"
  HISTORY_API_ADDR: "transactionhistory:8080"
  CONTACTS_API_ADDR: "contacts:8080"
  USERSERVICE_API_ADDR: "userservice:8080"

---
apiVersion: v1
kind: ConfigMap

metadata:
  name: demo-data-config

data:
  USE_DEMO_DATA: {{ .Values.config.useDemoData | quote }}
  DEMO_LOGIN_USERNAME: {{ .Values.config.demoLoginUsername | quote }}
  DEMO_LOGIN_PASSWORD: {{ .Values.config.demoLoginPassword | quote }}