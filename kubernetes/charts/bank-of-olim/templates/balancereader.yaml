apiVersion: apps/v1
kind: Deployment

metadata:
  name: balancereader

spec:
  replicas: {{ .Values.balancereader.replicas }}

  selector:
    matchLabels:
      app: balancereader

  template:
    metadata:
      labels:
        app: balancereader

    spec:
      serviceAccountName: {{ .Values.global.serviceAccountName }}

      containers:
        - name: balancereader

          image: "{{ .Values.balancereader.image.repository }}:{{ .Values.balancereader.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: VERSION
              value: {{ .Chart.AppVersion | quote }}

            - name: PORT
              value: "8080"

            - name: ENABLE_TRACING
              value: {{ .Values.config.enableTracing | quote }}

            - name: ENABLE_METRICS
              value: {{ .Values.config.enableMetrics | quote }}

            - name: POLL_MS
              value: "100"

            - name: CACHE_SIZE
              value: "1000000"

            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}

            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

          envFrom:
            - configMapRef:
                name: environment-config

            - secretRef:
                name: {{ .Values.secrets.ledgerDb }}

          volumeMounts:
            - name: publickey
              mountPath: /tmp/.ssh
              readOnly: true

          startupProbe:
            httpGet:
              path: /healthy
              port: 8080

            failureThreshold: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /ready
              port: 8080

            initialDelaySeconds: 60
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /healthy
              port: 8080

            initialDelaySeconds: 120
            periodSeconds: 5

          resources:
            {{- toYaml .Values.balancereader.resources | nindent 12 }}

      volumes:
        - name: publickey
          secret:
            secretName: {{ .Values.secrets.jwt }}
            items:
              - key: jwtRS256.key.pub
                path: publickey

---
apiVersion: v1
kind: Service

metadata:
  name: balancereader

spec:
  type: ClusterIP

  selector:
    app: balancereader

  ports:
    - name: http
      port: 8080
      targetPort: 8080