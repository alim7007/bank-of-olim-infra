apiVersion: apps/v1
kind: Deployment

metadata:
  name: ledgerwriter

spec:
  replicas: {{ .Values.ledgerwriter.replicas }}

  selector:
    matchLabels:
      app: ledgerwriter

  template:
    metadata:
      labels:
        app: ledgerwriter

    spec:
      serviceAccountName: {{ .Values.global.serviceAccountName }}

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      containers:
        - name: ledgerwriter

          image: "{{ .Values.ledgerwriter.image.repository }}:{{ .Values.ledgerwriter.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: VERSION
              value: {{ .Chart.AppVersion | quote }}

            - name: PORT
              value: "8080"

            - name: ENABLE_TRACING
              value: {{ .Values.config.enableTracing | quote }}

            - name: ENABLE_METRICS
              value: {{ .Values.config.enableMetrics | quote }}

            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}

            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

          envFrom:
            - configMapRef:
                name: environment-config

            - configMapRef:
                name: service-api-config

            - secretRef:
                name: {{ .Values.secrets.ledgerDb }}

          startupProbe:
            httpGet:
              path: /ready
              port: 8080

            failureThreshold: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /ready
              port: 8080

            initialDelaySeconds: 60
            periodSeconds: 5

          resources:
            {{- toYaml .Values.ledgerwriter.resources | nindent 12 }}

          volumeMounts:
            - name: tmp
              mountPath: /tmp

            - name: publickey
              mountPath: /tmp/.ssh
              readOnly: true

      volumes:
        - name: tmp
          emptyDir: {}

        - name: publickey
          secret:
            secretName: {{ .Values.secrets.jwt }}

            items:
              - key: jwtRS256.key.pub
                path: publickey

---
apiVersion: v1
kind: Service

metadata:
  name: ledgerwriter

spec:
  type: ClusterIP

  selector:
    app: ledgerwriter

  ports:
    - name: http
      port: 8080
      targetPort: 8080