global:
  environment: production
  imagePullPolicy: IfNotPresent
  serviceAccountName: bank-of-olim

config:
  localRoutingNum: "883745000"
  enableTracing: "false"
  enableMetrics: "true"
  logLevel: "info"

  useDemoData: "False"
  demoLoginUsername: ""
  demoLoginPassword: ""

secrets:
  jwt: jwt-key
  accountsDb: accounts-db-config
  ledgerDb: ledger-db-config

storage:
  className: do-block-storage-retain

frontend:
  replicas: 1

  image:
    repository: frontend
    tag: dev

  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

userservice:
  replicas: 1

  image:
    repository: userservice
    tag: dev

  resources:
    requests:
      cpu: 260m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

contacts:
  replicas: 1

  image:
    repository: contacts
    tag: dev

  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

ledgerwriter:
  replicas: 1

  image:
    repository: ledgerwriter
    tag: dev

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

balancereader:
  replicas: 1

  image:
    repository: balancereader
    tag: dev

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

transactionhistory:
  replicas: 1

  image:
    repository: transactionhistory
    tag: dev

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

accountsDb:
  image:
    repository: accounts-db
    tag: dev

  storage:
    size: 10Gi

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi

ledgerDb:
  image:
    repository: ledger-db
    tag: dev

  storage:
    size: 10Gi

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 250m
      memory: 1Gi

ingress:
  enabled: false

  className: traefik
  host: bank.example.com

  tls:
    enabled: true
    secretName: bank-of-olim-tls
    clusterIssuer: letsencrypt-production