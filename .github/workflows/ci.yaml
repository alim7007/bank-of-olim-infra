name: Infrastructure CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promotion-guard:
    name: Promotion guard
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Only dev can be merged into main
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "dev" ]; then
            echo "PRs into main are allowed only from dev (got: $HEAD_REF)"
            exit 1
          fi

  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"

      - name: Check formatting
        run: terraform fmt -check -recursive terraform

  helm:
    name: Helm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Bank of Olim chart
        run: |
          helm lint kubernetes/charts/bank-of-olim

      - name: Render chart for each environment
        run: |
          for env in production dev; do
            values="kubernetes/environments/${env}/apps/bank-of-olim/values.yaml"
            if [ -f "$values" ]; then
              echo "Rendering ${env}"
              helm template bank-of-olim \
                kubernetes/charts/bank-of-olim \
                -f "$values" > /dev/null
            else
              echo "No values for ${env}, skipping"
            fi
          done

  ansible:
    name: Ansible
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with Kubespray
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ansible dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core~=2.18"

          ansible-galaxy collection install kubernetes.core ansible.posix community.general

      - name: Syntax check (production)
        working-directory: ansible
        run: |
          ansible-playbook playbooks/site.yaml --syntax-check

      - name: Syntax check (dev)
        working-directory: ansible
        run: |
          ansible-playbook -i inventory/dev/inventory.ini playbooks/site-dev.yaml --syntax-check